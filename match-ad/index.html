<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="stylesheet" href="style.css" />
  <title>Match Playable Ad</title>
</head>
<body>
  <div class="ad-container">
    <h1>Match three to gain points</h1>
    <div class="info">
      <div class="score-container">Points: <span id="score">0</span></div>
      <div class="timer-container">Time left: <span id="timer">30</span></div>
    </div>
    <div class="grid" id="gameGrid"></div>
    <button id="restartButton">Restart</button>
  </div>
  <div class="popup hidden">
    <div class="popup-overlay"></div>
    <button id="ctaButton">Play more</button>
  </div>
  <script src="js/config.js"></script>
  <script src="js/game-initialazation.js"></script>
  <script src="js/game-process.js"></script>
  <script src="js/points-timer.js"></script>
  <script src="js/cta-handler.js"></script>
</body>
</html>
